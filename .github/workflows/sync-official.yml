name: Sync official resources

on:
  schedule:
    # 每周一、周四 UTC 00:00 运行一次
    - cron: '0 0 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 注意：不要在这里跑 fetch-official-resources.mjs —— 它会把 imageSource
      # 从「BWiki 升阶装束」改写回官网资讯来源，与主图策略冲突（2026-09-03 修复）。
      # 角色主图来源由 fetch-bwiki-ascended-art.mjs 在本地维护。

      - name: Sync official news
        run: node scripts/fetch-official-news.mjs

      - name: Sync official wallpapers
        run: node scripts/fetch-official-wallpapers.mjs

      - name: Sync story CG metadata (BWiki)
        run: node scripts/fetch-story-cgs.mjs

      - name: Sync character galleries
        run: node scripts/build-character-galleries.mjs

      # 必须在壁纸与留影数据更新后重跑，否则新 CG 会在剧情页重复展示
      - name: Dedupe official CGs vs story CGs
        run: node scripts/dedupe-official-cgs.mjs

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/content/updates src/data/official-wallpapers.json src/data/story-cgs.json src/data/official-cg-duplicates.json src/data/galleries.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: sync official news, wallpapers, story CGs and galleries'
          git push
